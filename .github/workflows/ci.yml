name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  leaks:
    runs-on: ubuntu-latest
    env:
      BETTERLEAKS_VERSION: 1.10.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install betterleaks (checksum verified)
        run: |
          set -euo pipefail
          # The SHA-256 is the one the release publishes in checksums.txt for
          # betterleaks_1.10.1_linux_x64.tar.gz (immutable release v1.10.1).
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          tarball="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          echo "c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e  ${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/betterleaks"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/betterleaks" betterleaks
          echo "${RUNNER_TEMP}/betterleaks" >> "${GITHUB_PATH}"
      # --config: betterleaks does not load .gitleaks.toml on its own.
      - run: betterleaks git . --config .gitleaks.toml --redact --no-banner
